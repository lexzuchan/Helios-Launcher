name: Build Helios Launcher

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Test flight dynamics and desktop startup
        run: |
          python -m unittest discover -s tests -v
          python scripts/smoke_ui.py
      - name: Package Windows executable
        run: python -m PyInstaller --clean --noconfirm HeliosLauncher.spec
      - name: Include documentation
        shell: pwsh
        run: |
          Copy-Item README.md, LICENSE, CHANGELOG.md -Destination dist/HeliosLauncher/
          Copy-Item docs -Destination dist/HeliosLauncher/docs -Recurse
      - name: Upload executable bundle
        uses: actions/upload-artifact@v4
        with:
          name: HeliosLauncher-Windows-x64
          path: dist/HeliosLauncher/
          if-no-files-found: error
          retention-days: 30
